name: trabajo-final-ci

on:
  push:
    branches: [main]
    paths:
      - "trabajo_final/**"
      - ".github/workflows/trabajo_final.yml"
  pull_request:
    paths:
      - "trabajo_final/**"
      - ".github/workflows/trabajo_final.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trabajo_final
    env:
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trabajo_final/pyproject.toml
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests + cobertura
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=70
