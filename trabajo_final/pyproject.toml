[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airbnb-price"
version = "0.1.0"
description = "Estimador del precio por noche de alojamientos en Madrid (DSIA, Trabajo Final)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alvaro Figueroa" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "huggingface_hub>=0.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
airbnb-price = "airbnb_price.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests que usan ficheros reales o varias capas a la vez",
]

[tool.coverage.run]
source = ["airbnb_price"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
